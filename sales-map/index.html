<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GeoMap 批量地址地图打点工具</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Leaflet 核心 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 测距工具 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-ruler@1.0.5/dist/leaflet-ruler.min.css" />
    <script src="https://unpkg.com/leaflet-ruler@1.0.5/dist/leaflet-ruler.min.js"></script>
    <!-- Excel解析 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- 截图导出 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <!-- 顶部 -->
    <div class="header">
        <h1>🌍 批量地址地图打点工具</h1>
        <div class="control-bar">
            <label for="fileInput" class="upload-btn">📁 上传文件</label>
            <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" hidden />
            <button id="exportImgBtn">🖼️ 导出地图为图片</button>
            <button id="exportCsv">📄 导出带经纬度CSV</button>
            <button id="exportKml">📍 导出KML</button>
        </div>
        <div class="key-bar">
            <label for="gaodeKeyInput">高德 Web服务 Key</label>
            <input type="password" id="gaodeKeyInput" autocomplete="off" spellcheck="false" placeholder="在此粘贴 Key 并保存（仅存本机浏览器，可不修改代码）" />
            <button type="button" id="saveGaodeKeyBtn">保存 Key</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
        <details class="usage-details">
            <summary>📖 使用方法 & 文件格式说明</summary>
            <div class="desc-content">
                <p>1. 支持上传文件：<strong>.csv / .xlsx / .xls</strong></p>
                <p>2. 表格必须包含任意一列：<strong>地址 / address / Addr</strong>，支持中文及海外地址</p>
                <p>3. 自动将地址转为经纬度并打点（高德API），点击标记可查看完整信息</p>
                <p>4. 地图自带比例尺 & 测距工具（点击左侧标尺图标启用）</p>
                <p>5. 支持导出：地图图片、带经纬度CSV表格、KML文件</p>
                <p class="sample-hint">📌 示例表格列：地址 | 名称 | 国家 | 备注</p>
            </div>
        </details>
    </div>

    <!-- 地图 -->
    <div id="mapWrap">
        <div id="map"></div>
    </div>

    <script>
        // ========== 高德API Key（替换成你自己的）==========
        const GAODE_KEY = 'YOUR_GAODE_KEY_HERE';
        var LS_GAODE_KEY = 'sales_map_gaode_key_v1';

        function getEffectiveGaodeKey() {
            try {
                var fromLs = (localStorage.getItem(LS_GAODE_KEY) || '').trim();
                if (fromLs) return fromLs;
            } catch (eLs) {}
            var k = (GAODE_KEY || '').trim();
            if (k && k !== 'YOUR_GAODE_KEY_HERE') return k;
            return '';
        }

        function geoKeyMissing() {
            return !getEffectiveGaodeKey();
        }

        // ========== 初始化地图 ==========
        const map = L.map('map').setView([30, 105], 4);

        if (geoKeyMissing()) {
            showStatus('❌ 缺少高德 Key：在上方输入框粘贴后点「保存 Key」，或编辑 index.html 中的 GAODE_KEY', true);
        }

        // OpenStreetMap 瓦片
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            crossOrigin: true,
            maxZoom: 18
        }).addTo(map);

        window.addEventListener('load', function () {
            map.invalidateSize();
        });

        // 比例尺
        L.control.scale({ imperial: false, metric: true, position: 'bottomleft' }).addTo(map);

        // 测距工具
        try {
            L.ruler({
                position: 'topleft',
                circleMarker: { color: '#2196F3', radius: 4 },
                lineStyle: { color: '#2196F3', weight: 3 }
            }).addTo(map);
        } catch (e) {
            console.warn('测距工具加载失败，不影响其他功能');
        }

        // 全局数据
        let allData = [];
        let markers = [];

        // ========== 状态提示 ==========
        function showStatus(text, isError = false) {
            const el = document.getElementById('statusMsg');
            el.textContent = text;
            el.className = 'status-msg ' + (isError ? 'error' : 'info');
            if (!isError) {
                setTimeout(() => { el.textContent = ''; el.className = 'status-msg'; }, 6000);
            }
        }

        document.getElementById('saveGaodeKeyBtn').addEventListener('click', function () {
            var inp = document.getElementById('gaodeKeyInput');
            var v = (inp.value || '').trim();
            if (!v) {
                showStatus('⚠️ 请先粘贴高德 Web服务 Key', true);
                return;
            }
            try {
                localStorage.setItem(LS_GAODE_KEY, v);
                inp.value = '';
                showStatus('✅ Key 已保存到本机，请重新上传表格', false);
            } catch (e) {
                showStatus('❌ 无法写入本地存储（是否开启了无痕模式？）', true);
            }
        });

        // ========== 延时函数 ==========
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        /** 高德无法覆盖大量海外点名；Photon（OSM）作为浏览器端后备（无需 Key） */
        async function geoCodePhoton(trimmed, countryHint) {
            try {
                var q = trimmed;
                if (countryHint) q = q + ', ' + countryHint;
                var url =
                    'https://photon.komoot.io/api/?limit=1&q=' + encodeURIComponent(q);
                var res = await fetch(url);
                if (!res.ok) return null;
                var data = await res.json();
                if (!data.features || data.features.length === 0) return null;
                var c = data.features[0].geometry.coordinates;
                if (!c || c.length < 2) return null;
                return { lat: parseFloat(c[1]), lon: parseFloat(c[0]) };
            } catch (e) {
                return null;
            }
        }

        /** file:// 等场景下 fetch 常被 CORS 拦截，使用 JSONP 调用高德地理编码 */
        function geoCodeJsonp(address) {
            return new Promise(function (resolve, reject) {
                var cbName = 'amap_geocode_' + Date.now() + '_' + Math.floor(Math.random() * 1e9);
                var script = document.createElement('script');
                var timer = setTimeout(function () {
                    cleanup();
                    reject(new Error('jsonp timeout'));
                }, 20000);
                function cleanup() {
                    clearTimeout(timer);
                    try {
                        delete window[cbName];
                    } catch (e0) {}
                    if (script.parentNode) {
                        script.parentNode.removeChild(script);
                    }
                }
                window[cbName] = function (data) {
                    cleanup();
                    resolve(data);
                };
                script.onerror = function () {
                    cleanup();
                    reject(new Error('jsonp script error'));
                };
                var qs =
                    'key=' +
                    encodeURIComponent(getEffectiveGaodeKey()) +
                    '&address=' +
                    encodeURIComponent(address) +
                    '&output=json&callback=' +
                    cbName;
                script.src = 'https://restapi.amap.com/v3/geocode/geo?' + qs;
                document.head.appendChild(script);
            });
        }

        /** 表头误入数据行、或过短字符串，避免浪费配额与 ENGINE_RESPONSE_DATA_ERROR */
        function isTrivialGeocodeAddress(s) {
            var t = (s || '').trim();
            if (t.length < 3) return true;
            return /^(地址|详细地址|位置|address|addr)$/i.test(t);
        }

        /** 外文地名高德常误匹配国内同名点；此类查询应丢弃「中国」结果改走 Photon */
        function looksLikeForeignPlaceName(s) {
            var t = (s || '').trim();
            if (t.length < 3) return false;
            var letters = (t.match(/[A-Za-z]/g) || []).length;
            var cjk = (t.match(/[一-鿿]/g) || []).length;
            if (letters < 3) return false;
            if (cjk === 0) return true;
            return letters >= cjk * 2;
        }

        // ========== 地理编码（高德API + Photon 后备）==========
        async function geoCode(address, countryHint) {
            var trimmed = (address || '').trim();
            var hint = (countryHint || '').trim();
            if (!trimmed) return null;
            if (isTrivialGeocodeAddress(trimmed)) {
                return null;
            }

            var isForeign = looksLikeForeignPlaceName(trimmed);

            function parseGaodeResult(json) {
                if (!json || typeof json !== 'object') {
                    return null;
                }
                if (json.status === '1' && json.geocodes && json.geocodes.length > 0) {
                    var g0 = json.geocodes[0];
                    const loc = g0.location.split(',');
                    return { lat: parseFloat(loc[1]), lon: parseFloat(loc[0]) };
                }
                return null;
            }

            // 外文地址（如墨西哥）：高德不可靠，优先 Photon，Photon 失败再回退高德
            if (isForeign) {
                var photonPos = await geoCodePhoton(trimmed, hint);
                if (photonPos) return photonPos;
                // Photon 失败才用高德
                if (geoKeyMissing()) return null;
            }

            if (geoKeyMissing()) return null;

            const url =
                'https://restapi.amap.com/v3/geocode/geo?key=' +
                encodeURIComponent(getEffectiveGaodeKey()) +
                '&address=' +
                encodeURIComponent(trimmed) +
                '&output=json';

            var maxAttempts = 6;
            for (var attempt = 0; attempt < maxAttempts; attempt++) {
                try {
                    const res = await fetch(url);
                    const json = await res.json();
                    var isRateLimited =
                        String(json.infocode) === '10021' ||
                        (json.info && String(json.info).indexOf('CUQPS_HAS_EXCEEDED') !== -1);
                    if (isRateLimited) {
                        await sleep(900 + attempt * 500);
                        continue;
                    }
                    var gaodePos = parseGaodeResult(json);
                    if (gaodePos) {
                        // 外文地址走 Photon 优先路径不应到这里；若到（Photon 未命中），额外校验
                        if (isForeign) {
                            var g0 = json.geocodes && json.geocodes[0];
                            var country = String(g0 && g0.country || '');
                            // 高德对外文地址可能误判到中国（同名地名），丢弃
                            if (country.indexOf('中国') !== -1) {
                                console.warn('高德外文误判中国，已丢弃：', trimmed);
                                return null;
                            }
                        }
                        return gaodePos;
                    }

                    // 高德未命中，尝试 Photon（非外文地址尚未尝试过 Photon）
                    if (!isForeign) {
                        await sleep(600);
                        var photonPos2 = await geoCodePhoton(trimmed, hint);
                        if (photonPos2) return photonPos2;
                    }

                    console.warn('未找到：', trimmed);
                    return null;
                } catch (e) {
                    // fetch 失败（如 file://），尝试 JSONP 方式调用高德
                    if (geoKeyMissing()) return null;
                    try {
                        const json = await geoCodeJsonp(trimmed);
                        var jp = parseGaodeResult(json);
                        if (jp) return jp;
                        await sleep(600);
                        var photonPos3 = await geoCodePhoton(trimmed, hint);
                        if (photonPos3) return photonPos3;
                        console.warn('未找到：', trimmed);
                        return null;
                    } catch (e2) {
                        console.error('解析异常：', trimmed, e.message);
                        return null;
                    }
                }
            }
            return null;
        }

        /** Excel 导出 CSV 常见：首列表头带 BOM（﻿），会导致读不到「地址」列 */
        function stripBomKey(k) {
            return String(k).replace(/^﻿/, '').trim();
        }

        function normalizeSheetRows(rows) {
            return rows.map(function (row) {
                var out = {};
                for (var k in row) {
                    if (!Object.prototype.hasOwnProperty.call(row, k)) continue;
                    out[stripBomKey(k)] = row[k];
                }
                return out;
            });
        }

        function pickAddressCell(item) {
            if (!item) return '';
            var keys = [
                '地址',
                '详细地址',
                '位置',
                '门店地址',
                '公司地址',
                '通讯地址',
                '收货地址',
                'address',
                'Addr',
                'Address',
                'location',
                'Location'
            ];
            for (var i = 0; i < keys.length; i++) {
                var v = item[keys[i]];
                if (v != null && String(v).trim() !== '') return String(v).trim();
            }
            return '';
        }

        function pickCountryCell(item) {
            if (!item) return '';
            var keys = ['Country', 'country', '国家', '国家/地区', '国别'];
            for (var i = 0; i < keys.length; i++) {
                var v = item[keys[i]];
                if (v != null && String(v).trim() !== '') return String(v).trim();
            }
            return '';
        }

        /** Excel 有时只有 Column1、Column2… 表头：按文本长度与中文字/地址特征打分，选出最像地址的一列 */
        function inferAddressColumnKey(rows) {
            if (!rows || rows.length === 0) return null;
            var keys = Object.keys(rows[0]);
            var bestKey = null;
            var bestScore = -1;
            keys.forEach(function (k) {
                var kl = String(k).toLowerCase().trim();
                if (/^(lat|lng|lon|latitude|longitude|纬度|经度)$/.test(kl)) return;
                var total = 0;
                var nonEmpty = 0;
                var addrHints = 0;
                for (var i = 0; i < rows.length; i++) {
                    var v = rows[i][k];
                    if (v == null || v === '') continue;
                    var s = String(v).trim();
                    if (!s) continue;
                    nonEmpty++;
                    total += s.length;
                    if (/[一-鿿]/.test(s)) total += 8;
                    if (/省|市|区|县|镇|乡|路|街|大道|巷|号|楼|室|自治区/.test(s)) addrHints++;
                    if (/^\d+(\.\d+)?$/.test(s) && s.length < 14) total -= 6;
                }
                if (nonEmpty === 0) return;
                var score = (total / nonEmpty) * Math.sqrt(nonEmpty) + addrHints * 4;
                if (score > bestScore) {
                    bestScore = score;
                    bestKey = k;
                }
            });
            return bestKey;
        }

        function pickAddressOrFallback(item, fallbackKey) {
            var a = pickAddressCell(item);
            if (a) return a;
            if (fallbackKey && item[fallbackKey] != null) {
                var s = String(item[fallbackKey]).trim();
                if (s) return s;
            }
            return '';
        }

        function rowNeedsGeocode(item, fallbackKey) {
            var lat = parseFloat(item.lat || item.Lat || item.LAT);
            var lon = parseFloat(item.lon || item.Lon || item.LON);
            if (!isNaN(lat) && !isNaN(lon)) return false;
            return !!pickAddressOrFallback(item, fallbackKey);
        }

        // ========== 文件上传处理 ==========
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            showStatus('⏳ 正在读取文件...');
            const reader = new FileReader();

            reader.onload = async (ev) => {
                try {
                    const data = new Uint8Array(ev.target.result);
                    var wb = XLSX.read(data, { type: 'array' });
                    var sheet = wb.Sheets[wb.SheetNames[0]];
                    var rawRows = XLSX.utils.sheet_to_json(sheet);
                    allData = normalizeSheetRows(rawRows);

                    var firstKeys = allData.length && allData[0] ? Object.keys(allData[0]) : [];
                    var rowsWithAddr = allData.filter(function (r) {
                        return !!pickAddressCell(r);
                    }).length;

                    // 中文 Windows 下「CSV(逗号分隔)」常为 ANSI/GBK；UTF-8 解析会导致乱码列名、读不到地址
                    if (/\.csv$/i.test(file.name) && allData.length > 0 && rowsWithAddr === 0) {
                        try {
                            var wb936 = XLSX.read(data, { type: 'array', codepage: 936 });
                            var sh936 = wb936.Sheets[wb936.SheetNames[0]];
                            var raw936 = XLSX.utils.sheet_to_json(sh936);
                            var norm936 = normalizeSheetRows(raw936);
                            var cnt936 = norm936.filter(function (r) {
                                return !!pickAddressCell(r);
                            }).length;
                            if (cnt936 > rowsWithAddr) {
                                wb = wb936;
                                sheet = sh936;
                                rawRows = raw936;
                                allData = norm936;
                                firstKeys = allData.length && allData[0] ? Object.keys(allData[0]) : [];
                                rowsWithAddr = cnt936;
                            }
                        } catch (eCsv) {}
                    }

                    var fallbackAddrKey = null;
                    if (rowsWithAddr === 0 && allData.length > 0) {
                        fallbackAddrKey = inferAddressColumnKey(allData);
                    }

                    var rowsWithAddrEff = allData.filter(function (r) {
                        return !!pickAddressOrFallback(r, fallbackAddrKey);
                    }).length;

                    var hasCoordsInSheet = allData.some(function (r) {
                        var la = parseFloat(r.lat || r.Lat || r.LAT);
                        var lo = parseFloat(r.lon || r.Lon || r.LON);
                        return !isNaN(la) && !isNaN(lo);
                    });

                    if (allData.length === 0) {
                        showStatus('⚠️ 表格为空，请检查文件内容', true);
                        return;
                    }

                    if (rowsWithAddrEff === 0 && !hasCoordsInSheet) {
                        showStatus(
                            '⚠️ 未识别到地址或经纬度：请使用「地址」列表头，或保证某一列为完整地址文本',
                            true
                        );
                        return;
                    }

                    if (fallbackAddrKey && rowsWithAddr === 0 && rowsWithAddrEff > 0) {
                        showStatus('📎 已自动将「' + fallbackAddrKey + '」列作为地址列（表头为 Column1 等时）', false);
                    }

                    // 清空旧标记
                    markers.forEach(m => map.removeLayer(m));
                    markers = [];
                    allData.forEach(item => { item.lat = null; item.lon = null; });

                    var needsGeo = allData.some(function (item) {
                        return rowNeedsGeocode(item, fallbackAddrKey);
                    });
                    if (needsGeo && geoKeyMissing()) {
                        showStatus('❌ 表格需要地理编码，请先保存高德 Web服务 Key 后再上传', true);
                        return;
                    }

                    showStatus(`📌 共 ${allData.length} 条数据，开始地理编码...`);
                    let successCount = 0;

                    for (let i = 0; i < allData.length; i++) {
                        const item = allData[i];

                        // 优先用已有经纬度
                        let lat = parseFloat(item.lat || item.Lat || item.LAT);
                        let lon = parseFloat(item.lon || item.Lon || item.LON);
                        let pos = null;

                        if (!isNaN(lat) && !isNaN(lon)) {
                            pos = { lat, lon };
                        } else {
                            // 没有经纬度，调用地理编码
                            const addr = pickAddressOrFallback(item, fallbackAddrKey);
                            if (addr) {
                                var country = pickCountryCell(item);
                                pos = await geoCode(addr, country);
                                await sleep(400);
                            }
                        }

                        if (pos) {
                            item.lat = pos.lat;
                            item.lon = pos.lon;
                            const marker = L.marker([pos.lat, pos.lon]).addTo(map);
                            let popHtml = '<div class="popup-content">';
                            for (let k in item) {
                                if (item.hasOwnProperty(k)) {
                                    popHtml += `<strong>${k}</strong>：${item[k]}<br>`;
                                }
                            }
                            popHtml += '</div>';
                            marker.bindPopup(popHtml, { maxWidth: 300 });
                            markers.push(marker);
                            successCount++;
                        }

                        // 更新进度
                        const pct = Math.round(((i + 1) / allData.length) * 100);
                        if (pct % 20 === 0 || i === allData.length - 1) {
                            showStatus(`🔄 处理中... ${i + 1}/${allData.length} (${pct}%) | 已定位：${successCount}`);
                        }
                    }

                    // 自动缩放到所有标记点
                    if (markers.length > 0) {
                        const group = L.featureGroup(markers);
                        map.fitBounds(group.getBounds().pad(0.1), { maxZoom: 12 });
                    }

                    showStatus(`✅ 完成！共 ${allData.length} 条数据，成功定位 ${successCount} 个点位`);
                } catch (err) {
                    console.error('文件解析失败：', err);
                    showStatus('❌ 文件解析失败，请确认格式正确（csv/xlsx/xls）', true);
                }
            };

            reader.readAsArrayBuffer(file);
        });

        // ========== 导出地图为图片 ==========
        document.getElementById('exportImgBtn').onclick = async () => {
            if (markers.length === 0) {
                showStatus('⚠️ 请先上传文件并完成打点', true);
                return;
            }
            showStatus('🖼️ 正在生成图片...');
            try {
                const canvas = await html2canvas(document.getElementById('map'), {
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#f5f5f5'
                });
                const a = document.createElement('a');
                a.download = `地图点位_${new Date().toISOString().slice(0, 10)}.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
                showStatus('✅ 图片已导出');
            } catch (err) {
                console.error('截图失败：', err);
                showStatus('❌ 截图失败，请重试', true);
            }
        };

        // ========== 导出CSV（含经纬度）==========
        document.getElementById('exportCsv').onclick = () => {
            if (allData.length === 0) {
                showStatus('⚠️ 请先上传文件并完成打点', true);
                return;
            }
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "点位数据");
            XLSX.writeFile(wb, `地址带经纬度_${new Date().toISOString().slice(0, 10)}.csv`);
            showStatus('✅ CSV 已导出');
        };

        // ========== 导出KML ==========
        document.getElementById('exportKml').onclick = () => {
            const placedItems = allData.filter(item => item.lat && item.lon);
            if (placedItems.length === 0) {
                showStatus('⚠️ 没有成功定位的点位可导出', true);
                return;
            }

            let kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>GeoMap 导出点位</name>`;

            placedItems.forEach(item => {
                const name = (item.名称 || item.name || item.地址 || item.address || '未命名').toString()
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                const desc = (item.备注 || item.note || '').toString()
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                kml += `
  <Placemark>
    <name>${name}</name>
    <description>${desc}</description>
    <Point>
      <coordinates>${item.lon},${item.lat},0</coordinates>
    </Point>
  </Placemark>`;
            });

            kml += `
</Document>
</kml>`;

            const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `点位_${new Date().toISOString().slice(0, 10)}.kml`;
            a.click();
            URL.revokeObjectURL(url);
            showStatus(`✅ KML 已导出，共 ${placedItems.length} 个点位`);
        };

        console.log('✅ GeoMap 批量地址打点工具已就绪（高德API）');
    </script>
</body>
</html>
